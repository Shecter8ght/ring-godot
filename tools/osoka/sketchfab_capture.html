<!doctype html>
<html><head><meta charset="utf-8"><title>sf capture</title>
<style>html,body{margin:0;background:#888}iframe{width:1600px;height:900px;border:0;display:block}</style>
<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
</head><body>
<iframe id="v" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>
<script>
// Просмотрщик Sketchfab с API: window.api после загрузки; window.shot(name,w,h) — снимок на локальный сервер
const uid = new URLSearchParams(location.search).get('uid');
window.ready = false;
const client = new Sketchfab('1.12.1', document.getElementById('v'));
client.init(uid, {
  success: function(api) {
    window.api = api;
    api.start();
    api.addEventListener('viewerready', function() { window.ready = true; });
  },
  error: function() { window.initError = true; },
  autostart: 1, preload: 1, ui_controls: 0, ui_infos: 0, ui_stop: 0, ui_watermark: 0,
  ui_hint: 0, ui_annotations: 0, ui_settings: 0, ui_help: 0, ui_inspector: 0, ui_vr: 0,
  ui_fullscreen: 0, ui_loading: 0, camera: 0, transparent: 0, dnt: 1
});
window.p = (fn, ...a) => new Promise((res, rej) => window.api[fn](...a, (err, r) => err ? rej(err) : res(r)));
window.shot = async (name, w, h) => {
  const data = await new Promise((res, rej) => window.api.getScreenShot(w || 2400, h || 1350, 'image/png', (e, d) => e ? rej(e) : res(d)));
  const r = await fetch('/save?name=' + encodeURIComponent(name), {method: 'POST', body: data});
  return await r.text();
};
window.saveJson = async (name, obj) => {
  const r = await fetch('/json?name=' + encodeURIComponent(name), {method: 'POST', body: JSON.stringify(obj, null, 1)});
  return await r.text();
};
</script></body></html>
