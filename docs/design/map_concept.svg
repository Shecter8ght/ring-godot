<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="1280" height="1080" font-family="Segoe UI, Arial, sans-serif">
  <!-- Схема новой карты зоны 1 (предложение 2026-10-07). Координаты — метры, север вверху. -->
  <rect x="0" y="0" width="640" height="540" fill="#1d201c"/>
  <!-- за границей: город и промзона (декорация) -->
  <rect x="0" y="0" width="640" height="470" fill="#262a25"/>
  <!-- игровая область -->
  <polygon points="40,62 180,48 330,52 470,44 590,64 612,170 604,300 566,420 430,448 300,436 200,446 90,414 30,300 22,170"
           fill="#3a4034" stroke="#c9b26b" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- лесополоса юг -->
  <path d="M200,446 C260,425 330,420 430,428 C480,432 530,420 566,420 L604,300 C590,360 560,400 520,408 C440,414 330,404 230,420 Z" fill="#2f4a2c" opacity="0.85"/>
  <!-- холм: горизонтали -->
  <ellipse cx="542" cy="368" rx="62" ry="48" fill="#4a4a36" stroke="#8c8455" stroke-width="0.8"/>
  <ellipse cx="542" cy="368" rx="42" ry="32" fill="#55543c" stroke="#8c8455" stroke-width="0.8"/>
  <ellipse cx="545" cy="366" rx="22" ry="17" fill="#615f43" stroke="#8c8455" stroke-width="0.8"/>
  <!-- овраг и ручей -->
  <path d="M30,92 C50,150 52,210 70,262 C88,312 120,360 165,392 C205,420 240,432 290,440" fill="none" stroke="#2a2f28" stroke-width="26" stroke-linecap="round"/>
  <path d="M30,92 C50,150 52,210 70,262 C88,312 120,360 165,392 C205,420 240,432 290,440" fill="none" stroke="#4d7a9a" stroke-width="3"/>
  <!-- насыпь ж/д -->
  <path d="M10,46 L630,34" stroke="#5b5243" stroke-width="16"/>
  <path d="M10,46 L630,34" stroke="#8a8172" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- дороги -->
  <g stroke="#55585a" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M40,72 L600,70"/>
    <path d="M612,215 L430,215 C400,215 380,232 352,232"/>
    <path d="M300,72 L300,40"/>
    <path d="M470,70 L470,215"/>
    <path d="M250,340 L250,380 C300,400 420,410 470,440"/>
    <path d="M150,72 L150,300 L110,300"/>
  </g>
  <!-- кольцевая дорога вокруг ТЦ -->
  <circle cx="250" cy="210" r="100" fill="none" stroke="#55585a" stroke-width="7"/>
  <!-- ТЦ Ø175 -->
  <circle cx="250" cy="210" r="87.5" fill="#6b6f74" stroke="#c9ccd0" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="30" fill="#8a8f95" stroke="#c9ccd0" stroke-width="1"/>
  <rect x="238" y="118" width="24" height="62" fill="#7d8187"/>
  <!-- площадь и остановка -->
  <rect x="205" y="80" width="90" height="28" fill="#4b4e50"/>
  <rect x="306" y="80" width="18" height="6" fill="#8b8f93"/>
  <!-- парковка -->
  <rect x="352" y="150" width="68" height="110" fill="#5c6064" stroke="#c9ccd0" stroke-width="1"/>
  <rect x="337" y="196" width="16" height="6" fill="#9aa0a6"/>
  <!-- погрузка в выемке -->
  <rect x="215" y="300" width="70" height="40" fill="#3d3f40" stroke="#a7a07e" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- хрущёвки -->
  <rect x="70" y="82" width="75" height="14" fill="#7a746a"/>
  <rect x="70" y="120" width="75" height="14" fill="#7a746a"/>
  <!-- рынок: павильоны и контейнеры -->
  <g fill="#7b6a52">
    <rect x="92" y="170" width="12" height="40"/><rect x="108" y="170" width="12" height="40"/><rect x="124" y="170" width="12" height="40"/>
    <rect x="92" y="216" width="44" height="10"/><rect x="92" y="232" width="20" height="26"/><rect x="116" y="232" width="20" height="26"/>
  </g>
  <!-- АЗС + шиномонтаж -->
  <rect x="440" y="84" width="34" height="22" fill="#8b7c5c"/><rect x="482" y="88" width="22" height="16" fill="#7a746a"/>
  <!-- гаражи -->
  <g fill="#6f6658"><rect x="452" y="130" width="118" height="14"/><rect x="452" y="158" width="118" height="14"/><rect x="452" y="186" width="90" height="12"/></g>
  <!-- блокпост -->
  <rect x="590" y="205" width="12" height="20" fill="#8f5a4a"/>
  <!-- недострой + кран -->
  <rect x="420" y="290" width="50" height="40" fill="#8b8f93" stroke="#d0d3d6" stroke-dasharray="2 2"/>
  <line x1="478" y1="300" x2="478" y2="262" stroke="#e0b84a" stroke-width="2"/><line x1="440" y1="262" x2="500" y2="262" stroke="#e0b84a" stroke-width="2"/>
  <!-- ретранслятор -->
  <line x1="545" y1="366" x2="545" y2="340" stroke="#e05a4a" stroke-width="2.5"/><rect x="530" y="370" width="14" height="10" fill="#7a746a"/>
  <!-- подстанция и отстойники -->
  <rect x="330" y="330" width="40" height="30" fill="#6f747a"/>
  <rect x="300" y="372" width="45" height="28" fill="#3e5a5a" stroke="#d9c45a" stroke-dasharray="3 2"/>
  <rect x="352" y="372" width="45" height="28" fill="#3e5a5a" stroke="#d9c45a" stroke-dasharray="3 2"/>
  <!-- частные дома -->
  <g fill="#7a6a5a"><rect x="118" y="326" width="14" height="12"/><rect x="146" y="344" width="14" height="12"/><rect x="100" y="362" width="14" height="12"/></g>
  <!-- мост через овраг -->
  <rect x="58" y="292" width="40" height="7" fill="#9a8f7a" transform="rotate(-20 78 296)"/>
  <!-- номера объектов -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <g fill="#c94c3c" stroke="#fff" stroke-width="0.8">
      <circle cx="250" cy="210" r="7"/><circle cx="386" cy="205" r="7"/><circle cx="250" cy="320" r="7"/><circle cx="250" cy="94" r="7"/>
      <circle cx="108" cy="108" r="7"/><circle cx="114" cy="200" r="7"/><circle cx="472" cy="95" r="7"/><circle cx="510" cy="165" r="7"/>
      <circle cx="445" cy="310" r="7"/><circle cx="545" cy="390" r="7"/><circle cx="350" cy="345" r="7"/><circle cx="128" cy="355" r="7"/>
      <circle cx="400" cy="40" r="7"/><circle cx="596" cy="236" r="7"/>
    </g>
    <text x="250" y="214">1</text><text x="386" y="209">2</text><text x="250" y="324">3</text><text x="250" y="98">4</text>
    <text x="108" y="112">5</text><text x="114" y="204">6</text><text x="472" y="99">7</text><text x="510" y="169">8</text>
    <text x="445" y="314">9</text><text x="545" y="394">10</text><text x="350" y="349">11</text><text x="128" y="359">12</text>
    <text x="400" y="44">13</text><text x="596" y="240">14</text>
  </g>
  <!-- высоты -->
  <g font-size="8" fill="#e8dfb0">
    <text x="530" y="335">+16 м, мачта 25 м</text><text x="404" y="285">9 эт. +27 м, кран</text>
    <text x="172" y="355">овраг −10 м</text><text x="292" y="352">−4 м</text><text x="356" y="146">3 ур. +9 м</text>
    <text x="470" y="30">насыпь +6 м</text><text x="186" y="126">подиум +1.5 м</text>
  </g>
  <!-- эвакуации и входы -->
  <g font-size="9" font-weight="700">
    <g fill="#5ad16a"><polygon points="300,32 294,22 306,22"/><polygon points="38,262 28,256 28,268"/><polygon points="470,452 464,462 476,462"/><polygon points="616,215 626,209 626,221"/><polygon points="250,333 244,343 256,343"/></g>
    <g fill="#5ad16a"><text x="310" y="26">Э1 путепровод</text><text x="2" y="282">Э2 мост</text><text x="480" y="462">Э3 лесная дорога</text><text x="560" y="250">Э4 блокпост*</text><text x="196" y="356">Э5 машина*</text></g>
    <g fill="#5ab2e0"><circle cx="44" cy="74" r="4"/><circle cx="36" cy="200" r="4"/><circle cx="380" cy="430" r="4"/><circle cx="600" cy="120" r="4"/></g>
  </g>
  <!-- линии огня (пример) -->
  <g stroke="#e05a4a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7">
    <line x1="545" y1="355" x2="350" y2="345"/><line x1="545" y1="355" x2="445" y2="215"/><line x1="478" y1="262" x2="300" y2="330"/>
  </g>
  <!-- масштаб -->
  <g transform="translate(20,486)">
    <rect x="0" y="0" width="100" height="5" fill="#ddd"/><rect x="50" y="0" width="50" height="5" fill="#666"/>
    <text x="0" y="18" font-size="9" fill="#ddd">0</text><text x="45" y="18" font-size="9" fill="#ddd">50</text><text x="90" y="18" font-size="9" fill="#ddd">100 м</text>
  </g>
  <!-- легенда -->
  <g font-size="8.5" fill="#e6e6e6" transform="translate(140,480)">
    <text x="0" y="0">1 ТЦ Ø175 · 2 парковка · 3 погрузка в выемке, тоннель · 4 площадь, остановка · 5 хрущёвки · 6 рынок, контейнеры · 7 АЗС, шиномонтаж</text>
    <text x="0" y="13">8 гаражи на склоне · 9 недострой с краном · 10 холм, ретранслятор · 11 подстанция, отстойники · 12 овраг, частные дома · 13 насыпь ж/д · 14 блокпост</text>
    <text x="0" y="26" fill="#5ad16a">▲ эвакуации (* — по условию)</text><text x="160" y="26" fill="#5ab2e0">● входы групп</text><text x="250" y="26" fill="#e05a4a">- - дальние линии огня</text><text x="380" y="26" fill="#c9b26b">- - граница карты ~620 × 460 м</text>
  </g>
</svg>
