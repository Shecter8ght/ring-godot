<script>
const tl = gsap.timeline({paused:true});
// Подъём слов по образцу per-word-rise; после появления слова стоят неподвижно.
function rise(selector,start,duration=.48,stagger=.08){
  tl.fromTo(selector,{y:24,opacity:0},{y:0,opacity:1,duration,stagger,ease:'power3.out',immediateRender:false},start);
}
rise('#hook .word',.04,.32,.07);
tl.fromTo('#hook .hook-panel',{x:-32},{x:0,duration:.4,ease:'power3.out'},0);
// beat-locked: 2.50s — общий план кольца.
tl.fromTo('.ring-title',{x:-35,opacity:0},{x:0,opacity:1,duration:.55,ease:'power3.out',immediateRender:false},2.5);
tl.to('.ring-title',{opacity:0,duration:.35},7.1);
// beat-locked: 7.50s — возврат к игровому действию.
[['#contact-label .tag',7.5],['#loot-label .tag',16.5],['#evac-label .tag',21.5]].forEach(([s,t])=>rise(s,t,.35,0));
// beat-locked: 31.50s — финальный акцент собственной партитуры.
tl.fromTo('.end-name',{y:35,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out',immediateRender:false},31.5);
tl.fromTo('.eyebrow',{opacity:0},{opacity:1,duration:.45,immediateRender:false},31.65);
tl.fromTo('.end-rule',{scaleX:0},{scaleX:1,duration:.65,ease:'power2.inOut',immediateRender:false},31.7);
rise('.end-line .word',32.05,.5,.1);
tl.fromTo('.end-detail',{opacity:0},{opacity:1,duration:.6,immediateRender:false},32.7);
// Извлечённый спектр задаёт воспроизводимую яркость эмблемы в каждом кадре.
for(let frame=945;frame<1080;frame++){
  const bass=window.RING_AUDIO.frames[frame].bands[0];
  tl.to('#emblem',{opacity:.50+.20*bass,duration:.033,ease:'none'},frame/30);
}
window.__timelines['ring-trailer']=tl;
</script></body></html>
